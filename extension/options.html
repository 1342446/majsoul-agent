<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>模型分析设置</title>
<link rel="stylesheet" href="options.css"></head><body><main>
<h1>分析服务</h1>
<form id="config">
<label class="toggle"><input id="enabled" type="checkbox"> 开启模型分析</label>
<label for="provider">服务类型</label><select id="provider"><option value="chat">OpenAI 兼容</option><option value="mjai">本地 mjai</option></select>
<p id="providerHint" class="hint"></p>
<label for="endpoint">API 请求地址</label><input id="endpoint" type="url" placeholder="https://api.openai.com/v1" required>
<p id="endpointHint" class="hint">自动补全 /chat/completions，也可填写完整接口地址。</p>
<label for="model">模型名称</label><input id="model" placeholder="例如 deepseek-chat" maxlength="200" required>
<label for="key" id="keyLabel">API Key</label><input id="key" type="password" autocomplete="off" placeholder="本地服务无需密钥时可留空" maxlength="4096">
<p class="hint">开启模型调用后，将向所配置的服务发送公开牌局信息和自家手牌，可能产生费用。</p>
<div class="actions"><button type="submit">保存设置</button><button type="button" id="disable">关闭分析</button><button type="button" id="clear">清除配置</button></div>
</form><p id="status" role="status" aria-live="polite"></p>
<p class="hint footnote">密钥仅保存在本机。</p>
</main><script src="adapters/model-endpoint.js"></script><script src="adapters/engine-endpoint.js"></script><script src="options.js"></script></body></html>
