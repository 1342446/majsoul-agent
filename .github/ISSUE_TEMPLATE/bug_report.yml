name: Bug report / 错误反馈
description: 报告可复现的问题，请使用人工或脱敏数据。
body:
  - type: markdown
    attributes:
      value: 请勿上传账号、API Key、cookie、原始HAR、完整牌谱或浏览器配置。协议问题优先使用人工最小事件。
  - type: input
    id: environment
    attributes:
      label: 扩展版本、浏览器与操作系统
      placeholder: 0.2.1 / Edge或Chrome版本 / Windows或其他系统
    validations:
      required: true
  - type: dropdown
    id: mode
    attributes:
      label: 使用模式
      options:
        - 实时牌局
        - 牌谱
        - 历史快照
        - 模型设置或分析
        - 离线演示
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: 复现步骤、预期与实际结果
      description: 如涉及模型，仅说明服务协议、模型名及脱敏错误，不要填写密钥或私人服务地址。
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: 数据检查
      options:
        - label: 我已检查内容，不包含凭据、账号信息或未经授权的对局数据。
          required: true
